name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install --legacy-peer-deps --no-audit --no-fund || (rm -rf node_modules package-lock.json && npm install --legacy-peer-deps --no-audit --no-fund --force)

      - name: Construire le site
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ sb_publishable_jtY6qqZkU6-fuC4MKRPr5A_dSkuWfBk }}
          VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
        run: npm run build

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fabriquer l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UNTRTCI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
