name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install --legacy-peer-deps --no-audit --no-fund || (rm -rf node_modules package-lock.json && npm install --legacy-peer-deps --no-audit --no-fund --force)

      - name: Construire le site
        run: npm run build

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Mettre l'icône de l'application
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r resources/android/* android/app/src/main/res/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fabriquer l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: UNTRTCI-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
